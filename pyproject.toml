[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioenv-foundry"
version = "0.5.0"
description = "Audio-native, deterministic RL environments for speech-to-speech agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AudioEnv Foundry contributors" }]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8", "pytest-cov>=5"]
platform = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]
train = ["torch>=2.4", "numpy>=2.0"]
qwen = [
  "accelerate>=1.2",
  "audioread>=3.0.1",
  "numpy>=2.0",
  "soundfile>=0.13",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=5.0",
  "qwen-omni-utils>=0.0.8",
  "peft>=0.17",
]
openenv = ["openenv-core"]
verifiers = ["verifiers"]
modal = ["modal>=1.1,<2"]
envharness = [
  "envharness @ git+https://github.com/google-research/envharness.git@fab7d57441f06b75c73a900e04561d4d7600f361",
]
tau2 = [
  "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@fc0055dc4e0a316c3f83133267fbd6faaa770992 ; python_version >= '3.12' and python_version < '3.14'",
]

[project.scripts]
audioenv = "audioenv.cli:main"
audioenv-gpu-worker = "audioenv.platform.gpu_worker:main"
audioenv-qwen-caller = "audioenv.platform.caller_service:main"
audioenv-validation-worker = "audioenv.validation_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audioenv"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "audioenv/web_dist"
"migrations" = "audioenv/migrations"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

